name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI entrypoint
        run: python skills/llm-wiki/scripts/wiki_tools.py --help
      - name: Confirm tests did not rewrite tracked files
        run: git diff --exit-code

  openai-validator:
    name: OpenAI skill validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Fetch current OpenAI skill validator
        run: git clone --depth 1 https://github.com/openai/skills.git "$RUNNER_TEMP/openai-skills"
      - name: Validate installable skill directory
        run: python "$RUNNER_TEMP/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py" skills/llm-wiki
